services:
  vue_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_vue_app
    # Explicitly set the user to 'appuser' created in the Dockerfile.
    # This ensures the container runs as the non-root user.
    user: "appuser"
    volumes:
      # Mount the host's app directory to /app in the container.
      # This allows for live code changes.
      - ./app:/app
      # Use a named volume specifically for node_modules.
      # This prevents the host's node_modules from overwriting
      # the one installed inside the container during the build.
      # The contents of node_modules from the image will be copied
      # into this named volume on its first creation.
      - node_modules_volume:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    tty: true
    restart: unless-stopped

# Define the named volume
volumes:
  node_modules_volume:
